name: Apply staged native fix

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/audit-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-hardening
          fetch-depth: 1
      - name: Apply staged native fix
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/native-fix/patch.b64
          base64 -d .github/native-fix/patch.b64 | gzip -dc > /tmp/native-fix.diff
          grep -q '^diff -ruN ' /tmp/native-fix.diff
          patch --dry-run -f -p3 < /tmp/native-fix.diff
          patch -f -p3 < /tmp/native-fix.diff
          rm -rf .github/native-fix
          rm -f .github/workflows/apply-native-fix.yml .github/workflows/apply-native-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix native PacketEvents reader and callback usage'
          git push origin HEAD:agent/audit-hardening
