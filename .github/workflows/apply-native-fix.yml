name: Apply native migration fix

on:
  push:
    branches: [ agent/audit-hardening ]
    paths:
      - '.github/workflows/apply-native-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/audit-hardening
          fetch-depth: 0
      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          root = Path('src/main/java')
          old = root / 'com/comphenix/protocol'
          new = root / 'de/jpx3/intave/packet/nativeapi'
          rename_file = {
              'ProtocolLibrary.java': 'PacketRuntime.java',
              'ProtocolManager.java': 'PacketRuntimeManager.java',
              'PacketContainer.java': 'NativePacket.java',
              'StructureModifier.java': 'NativeModifier.java',
              'MovingObjectPositionBlock.java': 'NativeBlockHit.java',
          }
          repls = [
              ('com.comphenix.protocol', 'de.jpx3.intave.packet.nativeapi'),
              ('ProtocolLibrary', 'PacketRuntime'),
              ('ProtocolManager', 'PacketRuntimeManager'),
              ('PacketContainer', 'NativePacket'),
              ('StructureModifier', 'NativeModifier'),
              ('MovingObjectPositionBlock', 'NativeBlockHit'),
          ]

          if old.exists():
              for p in old.rglob('*.java'):
                  rel = p.relative_to(old)
                  parts = list(rel.parts)
                  if parts[-1] in rename_file:
                      parts[-1] = rename_file[parts[-1]]
                  dst = new.joinpath(*parts)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  txt = p.read_text()
                  for a, b in repls:
                      txt = txt.replace(a, b)
                  dst.write_text(txt)

              for p in root.rglob('*.java'):
                  if old in p.parents:
                      continue
                  txt = p.read_text()
                  out = txt
                  for a, b in repls:
                      out = out.replace(a, b)
                  if out != txt:
                      p.write_text(out)
              shutil.rmtree(root / 'com')

          runtime = root / 'de/jpx3/intave'
          native_import = 'import de.jpx3.intave.packet.nativeapi.events.NativePacket;'
          for p in runtime.rglob('*.java'):
              txt = p.read_text()
              out = txt.replace('event.getPacket()', 'NativePacket.fromEvent(event)')
              out = out.replace('toBundle.getPacket()', 'NativePacket.fromEvent(toBundle)')
              out = out.replace(
                  'event.setPacket(packet = NativePacket.fromEvent(event).deepClone());',
                  'event.setLastUsedWrapper((packet = NativePacket.fromEvent(event).deepClone()).wrapper());'
              )
              out = out.replace(
                  'event.setPacket(NativePacket.fromEvent(event).deepClone());',
                  'event.setLastUsedWrapper(NativePacket.fromEvent(event).deepClone().wrapper());'
              )
              out = out.replace('event.setPacket(packet);', 'event.setLastUsedWrapper(packet.wrapper());')
              if 'NativePacket' in out and native_import not in out and 'package de.jpx3.intave.packet.nativeapi.events;' not in out:
                  lines = out.splitlines()
                  idx = next((i for i, line in enumerate(lines) if line.startswith('package ')), 0) + 1
                  lines.insert(idx, '')
                  lines.insert(idx + 1, native_import)
                  out = '\n'.join(lines) + '\n'
              if out != txt:
                  p.write_text(out)

          p = root / 'de/jpx3/intave/packet/nativeapi/events/NativePacket.java'
          txt = p.read_text()
          if 'public NativePacket(PacketTypeCommon type)' not in txt:
              txt = txt.replace(
                  '  private NativePacket(PacketType type, PacketWrapper<?> wrapper, ProtocolPacketEvent event) {',
                  '  public NativePacket(PacketTypeCommon type) {\n    this(PacketType.fromHandle(type));\n  }\n\n  private NativePacket(PacketType type, PacketWrapper<?> wrapper, ProtocolPacketEvent event) {'
              )
          if 'ProtocolPacketEvent protocolEvent()' not in txt:
              txt = txt.replace(
                  '  public PacketWrapper<?> wrapper() { return wrapper; }',
                  '  public PacketWrapper<?> wrapper() { return wrapper; }\n  public ProtocolPacketEvent protocolEvent() { return event; }'
              )
          p.write_text(txt)

          p = root / 'de/jpx3/intave/packet/nativeapi/PacketRuntimeManager.java'
          txt = p.read_text()
          if 'protocol.packettype.PacketTypeCommon' not in txt:
              txt = txt.replace(
                  'import com.github.retrooper.packetevents.PacketEvents;',
                  'import com.github.retrooper.packetevents.PacketEvents;\nimport com.github.retrooper.packetevents.protocol.packettype.PacketTypeCommon;'
              )
          if 'createPacket(PacketTypeCommon type)' not in txt:
              txt = txt.replace(
                  '  public NativePacket createPacket(PacketType type) { return new NativePacket(type); }',
                  '  public NativePacket createPacket(PacketType type) { return new NativePacket(type); }\n  public NativePacket createPacket(PacketTypeCommon type) { return new NativePacket(type); }'
              )
          p.write_text(txt)

          p = root / 'de/jpx3/intave/packet/PacketSender.java'
          txt = p.read_text()
          if native_import not in txt:
              txt = txt.replace(
                  'import com.github.retrooper.packetevents.wrapper.PacketWrapper;',
                  'import com.github.retrooper.packetevents.wrapper.PacketWrapper;\n' + native_import
              )
          if 'sendServerPacket(Player receiver, NativePacket packet)' not in txt:
              txt = txt.replace(
                  '  public static void sendServerPacket(Player receiver, Object byteBuf) {',
                  '  public static void sendServerPacket(Player receiver, NativePacket packet) {\n    if (packet != null && packet.wrapper() != null) PLAYER_MANAGER.sendPacket(receiver, packet.wrapper());\n  }\n\n  public static void sendServerPacketWithoutEvent(Player receiver, NativePacket packet) {\n    if (packet != null && packet.wrapper() != null) PLAYER_MANAGER.sendPacketSilently(receiver, packet.wrapper());\n  }\n\n  public static void receiveClientPacketFrom(Player receiver, NativePacket packet) {\n    if (packet != null && packet.wrapper() != null) PLAYER_MANAGER.receivePacket(receiver, packet.wrapper());\n  }\n\n  public static void sendServerPacket(Player receiver, Object byteBuf) {'
              )
          p.write_text(txt)

          p = root / 'de/jpx3/intave/packet/reader/PacketReaders.java'
          txt = p.read_text()
          if native_import not in txt:
              txt = txt.replace(
                  'import de.jpx3.intave.module.linker.packet.PacketId;',
                  'import de.jpx3.intave.module.linker.packet.PacketId;\n' + native_import
              )
          if 'readerOf(NativePacket packet)' not in txt:
              txt = txt.replace(
                  '  public static boolean hasReader(PacketTypeCommon type) {',
                  '  public static <T extends PacketReader> T readerOf(NativePacket packet) {\n    ProtocolPacketEvent event = packet.protocolEvent();\n    if (event == null) throw new IllegalArgumentException("Native packet is not backed by a packet event");\n    return readerOf(event);\n  }\n\n  public static boolean hasReader(PacketTypeCommon type) {'
              )
          p.write_text(txt)

          p = root / 'de/jpx3/intave/packet/Relative.java'
          txt = p.read_text()
          if native_import not in txt:
              txt = txt.replace(
                  'import de.jpx3.intave.klass.locate.Locate;',
                  'import de.jpx3.intave.klass.locate.Locate;\n' + native_import
              )
          if 'flagsFrom(NativePacket packet)' not in txt:
              txt = txt.replace(
                  '  public static Set<Relative> fromPacketEvents(RelativeFlag flags) {',
                  '  public static Set<Relative> flagsFrom(NativePacket packet) {\n    RelativeFlag flags = packet.getSpecificModifier(RelativeFlag.class).readSafely(0);\n    return flags == null ? new HashSet<Relative>() : fromPacketEvents(flags);\n  }\n\n  public static Set<Relative> fromPacketEvents(RelativeFlag flags) {'
              )
          p.write_text(txt)

          p = root / 'de/jpx3/intave/check/other/inventoryclickanalysis/InventoryStateGuard.java'
          txt = p.read_text().replace('    if (id != null && meta.serverWindowKnown', '    if (meta.serverWindowKnown')
          p.write_text(txt)

          p = root / 'de/jpx3/intave/config/ConfigLoaderFactory.java'
          txt = p.read_text()
          start = txt.index('  public ConfigurationLoader loaderFor(ConfigSelection selection) {')
          end = txt.index('\n  }\n}', start) + 4
          replacement = '''  public ConfigurationLoader loaderFor(ConfigSelection selection) {\n    if (selection == null) {\n      throw new IllegalArgumentException("Configuration selection cannot be null");\n    }\n    return selection.loader();\n  }'''
          p.write_text(txt[:start] + replacement + txt[end:])

          # PacketEvents events are directly mutable; ProtocolLib read-only toggles have no native equivalent.
          p = root / 'de/jpx3/intave/module/feedback/FeedbackSender.java'
          txt = p.read_text()
          txt = txt.replace('    if (event.isReadOnly()) {\n      event.setReadOnly(false);\n    }\n', '')
          txt = txt.replace('      if (toBundle.isReadOnly()) {\n        toBundle.setReadOnly(false);\n      }\n', '')
          p.write_text(txt)

          # Use PacketTypeCommon#getName instead of enum-only name().
          for p in runtime.rglob('*.java'):
              txt = p.read_text()
              out = txt.replace('event.getPacketType().name()', 'event.getPacketType().getName()')
              if out != txt:
                  p.write_text(out)

          # Reject any accidental legacy namespace/token after migration.
          forbidden = ('com.comphenix.protocol', 'ProtocolLibrary', 'ProtocolManager', 'PacketContainer', 'StructureModifier', 'MovingObjectPositionBlock')
          offenders = []
          for p in runtime.rglob('*.java'):
              txt = p.read_text()
              if any(token in txt for token in forbidden):
                  offenders.append(str(p))
          if offenders:
              raise SystemExit('Forbidden compatibility references remain:\n' + '\n'.join(offenders))
          PY

          git status --short
          git add -A src/main/java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish ProtocolLib namespace removal and native event migration'
          git push origin HEAD:agent/audit-hardening
