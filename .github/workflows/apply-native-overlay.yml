name: Apply native PacketEvents overlay

on:
  push:
    branches: [ agent/audit-hardening ]

permissions:
  contents: write

concurrency:
  group: native-packetevents-overlay
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-hardening
          fetch-depth: 0

      - name: Verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/native-overlay/part00
          test -f .github/native-overlay/part01
          test -f .github/native-overlay/part02
          test -f .github/native-overlay/part03
          test -f .github/native-overlay/part04
          test -f .github/native-overlay/part05
          test "$(cat .github/native-overlay/part* | wc -c)" -eq 93568
          cat .github/native-overlay/part* | base64 -d | gzip -dc > /tmp/native.diff
          grep -q '^diff -ruN ' /tmp/native.diff

      - name: Apply migration atomically
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -f -p4 < /tmp/native.diff
          patch -f -p4 < /tmp/native.diff
          rm -rf .github/native-overlay
          rm -f .github/workflows/apply-native-overlay.yml

      - name: Commit native migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Overlay produced no changes.' >&2; exit 1; }
          git commit -m 'Apply native PacketEvents source migration'
          git push origin HEAD:agent/audit-hardening
