name: Intave migration snapshot

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/packetevents-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
      - name: ProtocolLib migration inventory
        shell: bash
        run: |
          echo '=== FILES REFERENCING PROTOCOLLIB ==='
          grep -RIlE 'com\.comphenix\.protocol|ProtocolLib|PROTOCOLLIB' src build.gradle.kts 2>/dev/null | sort || true
          echo '=== REFERENCES ==='
          grep -RInE 'com\.comphenix\.protocol|ProtocolLib|PROTOCOLLIB' src build.gradle.kts 2>/dev/null || true
          echo '=== PACKET LINKER FILES ==='
          find src/main/java/de/jpx3/intave/module/linker/packet -type f -maxdepth 3 -print 2>/dev/null | sort || true
          echo '=== PACKET READER FILES ==='
          find src/main/java/de/jpx3/intave/packet -type f -maxdepth 4 -print 2>/dev/null | sort || true
      - name: Upload migration source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: intave-migration-source
          path: |
            src
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
          if-no-files-found: ignore
          retention-days: 1
