name: Migrate ProtocolLib data types

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/audit-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-hardening
          fetch-depth: 1
      - name: Replace passive ProtocolLib data types
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/main/java/de/jpx3/intave')
          changed = 0
          replacements = {
              'import com.comphenix.protocol.wrappers.BlockPosition;': 'import de.jpx3.intave.share.BlockPosition;',
              'import com.comphenix.protocol.wrappers.MinecraftKey;': 'import de.jpx3.intave.share.MinecraftKey;',
          }
          for path in root.rglob('*.java'):
              text = path.read_text()
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new)
                  changed += 1

          # Remove ProtocolLib conversion helpers only when no call site survives outside the owner.
          owners = [
              (root / 'share/MinecraftKey.java', ['fromProtocolLib', 'toProtocolLib']),
              (root / 'adapter/MinecraftVersion.java', ['toProtocolLibVersion', 'setProtocolLibVersion']),
          ]
          all_files = list(root.rglob('*.java'))
          for owner, names in owners:
              if not owner.exists():
                  continue
              text = owner.read_text()
              for name in names:
                  token = re.compile(r'\b' + re.escape(name) + r'\s*\(')
                  external = any(token.search(p.read_text(errors='ignore')) for p in all_files if p != owner)
                  if external:
                      continue
                  # Remove a normal Java method block with balanced braces starting at the method declaration.
                  m = re.search(r'(?ms)^\s*public\s+(?:static\s+)?[^\n{]+\b' + re.escape(name) + r'\s*\([^)]*\)\s*\{', text)
                  if not m:
                      continue
                  start = m.start()
                  brace = text.find('{', m.start())
                  depth = 0
                  end = None
                  for i in range(brace, len(text)):
                      if text[i] == '{': depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit(f'could not balance method {name} in {owner}')
                  text = text[:start] + '\n' + text[end:]
                  changed += 1
              owner.write_text(text)

          if changed == 0:
              raise SystemExit('No passive ProtocolLib data-type changes produced')
          print(f'Changed units: {changed}')
          PY

          rm -f .github/workflows/migrate-protocol-data-types.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Migrate passive ProtocolLib packet data types'
          git push origin HEAD:agent/audit-hardening
