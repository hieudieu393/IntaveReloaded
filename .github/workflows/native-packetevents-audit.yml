name: Native PacketEvents audit

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-hardening
          fetch-depth: 1

      - name: Restore complete Gradle definition when staged
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/build-full.b64 ]]; then
            echo 'No staged Gradle restoration.'
            exit 0
          fi
          base64 -d .github/build-full.b64 | gzip -dc > build.gradle.kts
          test "$(wc -l < build.gradle.kts)" -eq 778
          grep -q 'val legacyCompileJars = fileTree("libs")' build.gradle.kts
          grep -q 'enabled = false' build.gradle.kts
          rm -f .github/build-full.b64 .github/workflows/restore-complete-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore complete Gradle build definition'
          git push origin HEAD:agent/audit-hardening

  no-protocollib-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Inventory ProtocolLib compatibility usage
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9_])(com\.comphenix\.protocol|ProtocolLibrary|ProtocolManager|PacketContainer|StructureModifier|MovingObjectPositionBlock)([^A-Za-z0-9_]|$)'
          mapfile -t files < <(grep -RIl --include='*.java' --include='*.kt' -E "$pattern" src/main/java/de/jpx3/intave | sort || true)
          echo "ProtocolLib compatibility files: ${#files[@]}"
          printf '%s\n' "${files[@]}"
          if (( ${#files[@]} > 0 )); then
            echo 'ProtocolLib compatibility references remain; native PacketEvents migration is incomplete.' >&2
            exit 1
          fi
          echo 'No ProtocolLib compatibility references remain in Intave runtime source.'

      - name: Reject embedded ProtocolLib compatibility namespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d src/main/java/com/comphenix ]]; then
            mapfile -t files < <(find src/main/java/com/comphenix -type f | sort)
            echo "Embedded compatibility files: ${#files[@]}"
            printf '%s\n' "${files[@]}"
            echo 'Embedded ProtocolLib compatibility namespace still exists.' >&2
            exit 1
          fi
          echo 'No embedded ProtocolLib compatibility namespace.'
