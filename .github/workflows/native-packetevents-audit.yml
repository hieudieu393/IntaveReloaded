name: Native PacketEvents audit

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audit-hardening
          fetch-depth: 0

      - name: Apply staged migration when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/native-overlay/part00 ]]; then
            echo 'No staged native migration overlay.'
            exit 0
          fi
          for n in 00 01 02 03 04 05; do
            test -f ".github/native-overlay/part${n}"
          done
          test "$(cat .github/native-overlay/part* | wc -c)" -eq 93568
          cat .github/native-overlay/part* | base64 -d | gzip -dc > /tmp/native.diff
          grep -q '^diff -ruN ' /tmp/native.diff
          patch --dry-run -f -p4 < /tmp/native.diff
          patch -f -p4 < /tmp/native.diff
          rm -rf .github/native-overlay
          rm -f .github/workflows/apply-native-overlay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Overlay produced no changes.' >&2; exit 1; }
          git commit -m 'Apply native PacketEvents source migration'
          git push origin HEAD:agent/audit-hardening

  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record branch tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > branch-head.txt
          git rev-parse 'HEAD^{tree}' > branch-tree.txt

      - name: Resolve PacketEvents compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -q dependencies --configuration compileClasspath >/tmp/compile-classpath.txt
          mkdir -p packetevents-jars
          while IFS= read -r -d '' jar; do
            cp "$jar" "packetevents-jars/$(basename "$jar")"
          done < <(find "$HOME" "$GITHUB_WORKSPACE" -type f \
            \( -name 'packetevents-spigot-2.13.0.jar' -o -name 'packetevents-api-2.13.0.jar' -o -name 'packetevents-netty-common-2.13.0.jar' \) \
            -print0 2>/dev/null)
          if ! find packetevents-jars -type f -name '*.jar' -print -quit | grep -q .; then
            echo 'PacketEvents jars were resolved by Gradle but their cache location could not be discovered.' >&2
            find "$HOME" "$GITHUB_WORKSPACE" -type f -name '*packetevents*.jar' -print 2>/dev/null | head -100 >&2 || true
            cat /tmp/compile-classpath.txt >&2
            exit 1
          fi
          find packetevents-jars -type f -name '*.jar' -printf '%f\n' | sort

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -czf native-packetevents-source.tar.gz \
            src \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat \
            gradle \
            .github \
            README.md \
            branch-head.txt \
            branch-tree.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: native-packetevents-source
          path: native-packetevents-source.tar.gz
          if-no-files-found: error
          retention-days: 2

      - name: Upload PacketEvents jars
        uses: actions/upload-artifact@v7
        with:
          name: native-packetevents-jars
          path: packetevents-jars/*.jar
          if-no-files-found: error
          retention-days: 2

  no-protocollib-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Inventory ProtocolLib compatibility usage
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9_])(com\.comphenix\.protocol|ProtocolLibrary|ProtocolManager|PacketContainer|StructureModifier|MovingObjectPositionBlock)([^A-Za-z0-9_]|$)'
          mapfile -t files < <(grep -RIl --include='*.java' --include='*.kt' -E "$pattern" src/main/java/de/jpx3/intave | sort || true)
          echo "ProtocolLib compatibility files: ${#files[@]}"
          printf '%s\n' "${files[@]}"
          if (( ${#files[@]} > 0 )); then
            echo 'ProtocolLib compatibility references remain; native PacketEvents migration is incomplete.' >&2
            exit 1
          fi
          echo 'No ProtocolLib compatibility references remain in Intave runtime source.'

      - name: Reject embedded ProtocolLib compatibility namespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d src/main/java/com/comphenix ]]; then
            mapfile -t files < <(find src/main/java/com/comphenix -type f | sort)
            echo "Embedded compatibility files: ${#files[@]}"
            printf '%s\n' "${files[@]}"
            echo 'Embedded ProtocolLib compatibility namespace still exists.' >&2
            exit 1
          fi
          echo 'No embedded ProtocolLib compatibility namespace.'
