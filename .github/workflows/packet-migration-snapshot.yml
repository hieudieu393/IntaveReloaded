name: Packet migration final validation

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.head_ref == 'agent/packetevents-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/packetevents-migration
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Finalize PacketEvents migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          # PacketEvents is now a hard plugin dependency. Every development/test server must install it too.
          p = Path('build.gradle.kts')
          s = p.read_text()
          pe = '      modrinth("packetevents", "2.13.0+spigot")\n'

          needle = '    minecraftVersion(serverVersion)\n    // Minecraft 1.8.8 requires special patches to work with Java 17\n'
          repl = '    minecraftVersion(serverVersion)\n    downloadPlugins {\n' + pe + '    }\n    // Minecraft 1.8.8 requires special patches to work with Java 17\n'
          if needle in s and repl not in s:
              s = s.replace(needle, repl, 1)

          run_block = '    downloadPlugins {\n      modrinth("viaversion", "5.9.1")\n      modrinth("viabackwards", "5.9.1")\n    }\n'
          run_repl = '    downloadPlugins {\n      modrinth("packetevents", "2.13.0+spigot")\n      modrinth("viaversion", "5.9.1")\n      modrinth("viabackwards", "5.9.1")\n    }\n'
          if run_block in s:
              s = s.replace(run_block, run_repl)

          folia_needle = '    minecraftVersion(serverVersion)\n    runDirectory(File("runs/folia_${serverVersion}-j$javaVersion"))\n'
          folia_repl = '    minecraftVersion(serverVersion)\n    downloadPlugins {\n      modrinth("packetevents", "2.13.0+spigot")\n    }\n    runDirectory(File("runs/folia_${serverVersion}-j$javaVersion"))\n'
          if folia_needle in s:
              s = s.replace(folia_needle, folia_repl)

          for marker in [
              '  minecraftVersion("1.8.8")\n  runDirectory(File("runs/authtest"))\n',
              '  minecraftVersion("1.8.8")\n  runDirectory(File("runs/gommetest"))\n',
              '  minecraftVersion("1.20.1")\n  runDirectory(File("runs/authtest_1.20.1"))\n',
          ]:
              if marker in s:
                  version_line, run_line = marker.split('\n', 1)
                  s = s.replace(marker, version_line + '\n  downloadPlugins {\n    modrinth("packetevents", "2.13.0+spigot")\n  }\n' + run_line)
          p.write_text(s)

          # Java generic Class comparison needs a wildcard-safe form.
          p = Path('src/main/java/com/comphenix/protocol/events/PacketContainer.java')
          if p.exists():
              text = p.read_text().replace(
                  'wrapperClass == null || wrapperClass == PacketWrapper.class',
                  'wrapperClass == null || wrapperClass.getName().equals(PacketWrapper.class.getName())'
              )
              p.write_text(text)

          # User-facing diagnostics must identify the real packet library.
          for path in [
              Path('src/main/java/de/jpx3/intave/command/stages/DiagnosticsStage.java'),
              Path('src/main/java/de/jpx3/intave/command/stages/BaseStage.java'),
          ]:
              text = path.read_text()
              text = text.replace('protocolLibVersion', 'packetEventsVersion')
              text = text.replace('ProtocolLib is ', 'PacketEvents is ')
              text = text.replace('"ProtocolLib"', '"packetevents"')
              text = text.replace(' ProtocolLib: ', ' PacketEvents: ')
              text = text.replace('Intave is ', 'IntaveReloaded is ')
              path.write_text(text)

          p = Path('src/main/java/de/jpx3/intave/packet/PacketSender.java')
          text = p.read_text().replace(
              'Your version of ProtocolLib is broken, see https://github.com/dmulloy2/ProtocolLib/issues/1552 for details on the issue',
              'PacketEvents failed to send a packet; verify that PacketEvents 2.13.0 or newer is installed and initialized'
          )
          p.write_text(text)

          # Rename old API identifiers to PacketEvents/compatibility-neutral names.
          replacements = {
              'Engine.PROTOCOLLIB': 'Engine.PACKETEVENTS',
              'case PROTOCOLLIB:': 'case PACKETEVENTS:',
              'ProtocolLibraryAdapter': 'PacketEventsAdapter',
              'ProtocolLibrary': 'PacketEventsLibrary',
              'protocolLibAvailable': 'packetEventsAvailable',
              'toProtocolLibVersion': 'toPacketCompatibilityVersion',
              'fromProtocolLib': 'fromPacketCompatibility',
              'toProtocolLibPriority': 'toPacketEventsPriority',
              'translateProtocolLibPacketTypes': 'translatePacketEventsPacketTypes',
              'performInternalProtocolLibLinkage': 'performInternalPacketEventsLinkage',
              'performExternalProtocolLibLinkage': 'performExternalPacketEventsLinkage',
              'requireProtocolLib4': 'requirePacketEventsLegacyCompatible',
              'requireProtocolLib': 'requirePacketEvents',
          }
          for path in Path('src').rglob('*.java'):
              text = path.read_text()
              updated = text.replace('com.comphenix.protocol', 'de.jpx3.intave.packet.compat')
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'Engine.java':
                  updated = updated.replace('  PROTOCOLLIB,', '  PACKETEVENTS,')
              if updated != text:
                  path.write_text(updated)

          # Move the compatibility classes out of the third-party ProtocolLib namespace.
          old_root = Path('src/main/java/com/comphenix/protocol')
          new_root = Path('src/main/java/de/jpx3/intave/packet/compat')
          if old_root.exists():
              new_root.parent.mkdir(parents=True, exist_ok=True)
              if new_root.exists():
                  shutil.rmtree(new_root)
              shutil.move(str(old_root), str(new_root))

          old_library = new_root / 'ProtocolLibrary.java'
          new_library = new_root / 'PacketEventsLibrary.java'
          if old_library.exists():
              old_library.rename(new_library)

          old_adapter = Path('src/main/java/de/jpx3/intave/adapter/ProtocolLibraryAdapter.java')
          new_adapter = Path('src/main/java/de/jpx3/intave/adapter/PacketEventsAdapter.java')
          if old_adapter.exists():
              old_adapter.rename(new_adapter)
          PY

      - name: Commit final migration changes locally
        shell: bash
        run: |
          git config user.name "Onxe"
          git config user.email "hieudieu393@gmail.com"
          git add -A build.gradle.kts src
          if ! git diff --cached --quiet; then
            git commit -m "refactor: move compatibility layer to PacketEvents namespace"
          fi

      - name: Assert ProtocolLib namespace is gone
        shell: bash
        run: |
          if grep -R --line-number --include='*.java' 'com\.comphenix\.protocol' src; then
            echo 'ProtocolLib namespace references remain' >&2
            exit 1
          fi

      - name: Validate build against latest master
        shell: bash
        run: |
          git fetch origin master
          git merge --no-commit --no-ff origin/master
          ./gradlew build
          git merge --abort

      - name: Remove migration helper and publish
        shell: bash
        run: |
          git rm .github/workflows/packet-migration-snapshot.yml
          git commit -m "chore: remove migration helper"
          git push origin HEAD:agent/packetevents-migration
