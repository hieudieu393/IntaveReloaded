name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Verify Build Artifact
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/IntaveReloaded.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected artifact not found: $JAR" >&2
            echo "Contents of build/libs:" >&2
            ls -lah build/libs >&2 || true
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "artifact_name=IntaveReloaded-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Built artifact: $JAR"
          ls -lh "$JAR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/libs/IntaveReloaded.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IntaveReloaded.jar
          generate_release_notes: true
          draft: false
          prerelease: false

  nightly:
    name: Publish Nightly
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: IntaveReloaded Nightly
          files: dist/IntaveReloaded.jar
          body: |
            Automated nightly build of IntaveReloaded.
            Minecraft support: 1.21+
            Packet backend: PacketEvents 2.13.0+
          prerelease: true
          make_latest: false
