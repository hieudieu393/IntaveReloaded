name: Sync latest master and target 1.21+

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ agent/packetevents-migration ]

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'push' || github.head_ref == 'agent/packetevents-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/packetevents-migration
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Merge latest master
        shell: bash
        run: |
          git config user.name "Onxe"
          git config user.email "hieudieu393@gmail.com"
          git fetch origin master
          git merge -X theirs --no-edit origin/master

      - name: Restrict to Minecraft 1.21+
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('build.gradle.kts')
          s = p.read_text()
          s = s.replace('val simpleName = "Intave"', 'val simpleName = "IntaveReloaded"')
          s = s.replace(
            'authors = listOf("DarkAndBlue", "Jpx3", "vento", "vxcus", "lennoxlotl", "NotLucky", "Trattue")',
            'authors = listOf("Onxe", "DarkAndBlue", "Jpx3", "vento", "vxcus", "lennoxlotl", "NotLucky", "Trattue")'
          )
          s = s.replace('  testImplementation("net.dmulloy2:ProtocolLib:5.4.0")\n', '')
          if 'testRuntimeOnly("net.bytebuddy:byte-buddy:1.18.2")' not in s:
            s = s.replace('  compileOnly("net.bytebuddy:byte-buddy:1.18.2")\n', '  compileOnly("net.bytebuddy:byte-buddy:1.18.2")\n  testRuntimeOnly("net.bytebuddy:byte-buddy:1.18.2")\n')
          s = re.sub(r'  apiVersion = "[^"]+"', '  apiVersion = "1.21"', s, count=1)
          s = re.sub(r'  (?:depend = listOf\([^\n]*\)\n)?  softDepend = listOf\([^\n]*\)', '  depend = listOf("packetevents")\n  softDepend = listOf("ViaVersion")', s, count=1)

          def remove_braced(text, marker):
            start = text.find(marker)
            if start < 0: return text
            brace = text.find('{', start)
            depth = 0
            for i in range(brace, len(text)):
              depth += (text[i] == '{') - (text[i] == '}')
              if depth == 0:
                end = i + 1
                while end < len(text) and text[end] in '\r\n': end += 1
                return text[:start] + text[end:]
            return text

          for marker in [
            'tasks.register<RunServer>("authtest")',
            'tasks.register<RunServer>("gommetest")',
            'tasks.register<RunServer>("authtest_1.20.1")',
          ]:
            s = remove_braced(s, marker)

          s = re.sub(r'val paperRunConfigs = mapOf\(\n.*?\n\)', '''val paperRunConfigs = mapOf(
  Pair("1.21.1", 21),
  Pair("1.21.3", 21),
  Pair("1.21.4", 21),
  Pair("1.21.7", 21),
  Pair("1.21.11", 25),
  Pair("26.1.2", 25),
  Pair("26.2", 25),
)''', s, count=1, flags=re.S)

          # Remove old 1.8/1.9 server overrides from generated run tasks.
          s = re.sub(r'\n    // Minecraft 1\.8\.8 requires special patches to work with Java 17\n    if \(serverVersion == "1\.8\.8"\) \{.*?\n    \}\n    if \(serverVersion == "1\.9\.4"\) \{.*?\n    \}\n', '\n', s, flags=re.S)

          # Keep only 1.21+ MCP client configs imported from current master.
          a = s.find('val mcpRebornClientConfigs = mapOf(')
          if a >= 0:
            body = s.find('\n', a) + 1
            end = s.find('\n)', body)
            chunk = s[body:end]
            entries, cur = [], []
            for line in chunk.splitlines(True):
              if line.startswith('  mcpClient(') and cur:
                entries.append(''.join(cur)); cur = [line]
              else: cur.append(line)
            if cur: entries.append(''.join(cur))
            keep = []
            for e in entries:
              m = re.search(r'mcpClient\("([^"]+)"', e)
              if not m: continue
              v = m.group(1).split('.')
              major, minor = int(v[0]), int(v[1]) if len(v) > 1 else 0
              if major > 1 or (major == 1 and minor >= 21): keep.append(e)
            s = s[:body] + ''.join(keep) + s[end:]
          for name in ['mcpJvm8', 'mcpJvm16', 'mcpJvm17Legacy', 'mcpJvm17']:
            s = re.sub(rf'val {name} = .*\n', '', s)
          s = s.replace('return major > 1 || major == 1 && minor >= 14', 'return major > 1 || major == 1 && minor >= 21')

          # PacketEvents must be present in generated server tasks.
          test_start, run_start = s.find('fun registerPaperTestTask('), s.find('fun registerPaperRunTask(')
          if test_start >= 0 and run_start > test_start:
            part = s[test_start:run_start]
            if 'modrinth("packetevents"' not in part:
              part = part.replace('    minecraftVersion(serverVersion)\n', '    minecraftVersion(serverVersion)\n    downloadPlugins {\n      modrinth("packetevents", "2.13.0+spigot")\n    }\n', 1)
              s = s[:test_start] + part + s[run_start:]
          run_start, folia_start = s.find('fun registerPaperRunTask('), s.find('fun registerFoliaRunTask(')
          if run_start >= 0 and folia_start > run_start:
            part = s[run_start:folia_start]
            if 'modrinth("packetevents"' not in part:
              part = part.replace('    downloadPlugins {\n', '    downloadPlugins {\n      modrinth("packetevents", "2.13.0+spigot")\n', 1)
              s = s[:run_start] + part + s[folia_start:]
          folia_start = s.find('fun registerFoliaRunTask(')
          if folia_start >= 0:
            part = s[folia_start:]
            if 'modrinth("packetevents"' not in part:
              part = part.replace('    minecraftVersion(serverVersion)\n', '    minecraftVersion(serverVersion)\n    downloadPlugins {\n      modrinth("packetevents", "2.13.0+spigot")\n    }\n', 1)
              s = s[:folia_start] + part
          p.write_text(s)

          for f in [Path('src/main/java/de/jpx3/intave/command/stages/DiagnosticsStage.java'), Path('src/main/java/de/jpx3/intave/command/stages/BaseStage.java')]:
            if f.exists():
              t = f.read_text().replace('protocolLibVersion', 'packetEventsVersion').replace('ProtocolLib is ', 'PacketEvents is ').replace('"ProtocolLib"', '"packetevents"').replace(' ProtocolLib: ', ' PacketEvents: ').replace('Intave is ', 'IntaveReloaded is ')
              f.write_text(t)

          versions = ['1.21.1','1.21.3','1.21.4','1.21.7','1.21.11','26.1.2','26.2']
          for wf in Path('.github/workflows').glob('*.y*ml'):
            text = wf.read_text()
            if 'Self-tests' not in text: continue
            lines = text.splitlines()
            mi = next((i for i,l in enumerate(lines) if l.strip() == 'matrix:'), None)
            if mi is None: continue
            for i in range(mi+1, min(len(lines), mi+25)):
              if lines[i].strip().startswith('version:'):
                indent = lines[i][:-len(lines[i].lstrip())]
                lines[i] = indent + 'version: [' + ', '.join(f'"{v}"' for v in versions) + ']'
                j=i+1
                while j < len(lines) and lines[j].strip().startswith('- ') and (len(lines[j])-len(lines[j].lstrip())) > len(indent):
                  del lines[j]
                break
            wf.write_text('\n'.join(lines)+'\n')
          PY

      - name: Verify target and build
        shell: bash
        run: |
          grep -q 'apiVersion = "1.21"' build.gradle.kts
          ! grep -A20 'val paperRunConfigs' build.gradle.kts | grep -E 'Pair\("1\.(8|9|1[0-9]|20)'
          ! grep -q 'testImplementation("net.dmulloy2:ProtocolLib' build.gradle.kts
          ./gradlew build

      - name: Commit synchronized source
        shell: bash
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync master and target Minecraft 1.21+"
          fi

      - name: Remove helper and push
        shell: bash
        run: |
          git rm .github/workflows/sync-main-1.21.yml
          git commit -m "chore: remove sync helper"
          git push origin HEAD:agent/packetevents-migration
