name: Validate PacketEvents migration

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  migrate-and-compile:
    if: github.head_ref == 'agent/packetevents-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply PacketEvents migration
        run: python3 .github/intave_packetevents_migrate.py
      - name: Verify ProtocolLib removal
        shell: bash
        run: |
          if grep -RIniE 'com\.comphenix|protocollib' src build.gradle.kts settings.gradle.kts; then
            echo 'ProtocolLib references remain after migration.'
            exit 1
          fi
      - name: Compile migration
        run: ./gradlew compileJava --stacktrace
      - name: Commit migration source
        shell: bash
        run: |
          git config user.name 'Onxe'
          git config user.email 'hieudieu393@gmail.com'
          git add src build.gradle.kts settings.gradle.kts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: migrate packet layer to PacketEvents'
          git push origin HEAD:agent/packetevents-migration
