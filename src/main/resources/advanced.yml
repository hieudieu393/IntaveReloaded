# IntaveReloaded - advanced configuration
#
# The layout intentionally follows the original Intave 14 configuration so existing
# administrators and integrations keep familiar internal keys.
#
# Reloaded adds supplemental checks on top of the original parent pipelines. Unless a
# dedicated setting is documented below, these guards report into the parent check VL:
#   Simulate/NoFall/NoSlow/Phase/Sprint/Elytra/Vehicle -> check.physics
#   KillAura/Aim                                      -> check.heuristics
#   BadPackets                                        -> check.protocolscanner
#   AutoTotem/AutoSwap/Inventory                      -> check.inventoryclickanalysis
#   Scaffold                                          -> check.placementanalysis
#   FastBreak                                         -> check.breakspeedlimiter
#
# Do not blindly lower thresholds. Reloaded deliberately buffers modern signals and
# applies exemptions for teleport, vehicle, latency and uncertain client state.

version: "14.0.0"
state: 0

check:
  physics:
    # The physics simulator is mandatory. This setting only increases tolerance.
    high-tolerance: false

    # Mitigation mode: AGGRESSIVE, CAREFUL, LENIENT, BARELY or SILENT.
    mitigation: BARELY

    # Enforce vanilla item-use slowdown (NoSlow coverage).
    enforce-item-slowdown: true

    # Keep the original physics synchronization behavior.
    no-speculative-velocity: true
    no-bundling: false

    on-detection:
      reset-item-usage: true
      # true / false / SILENT
      close-inventory: true
      refresh-nearby-blocks: true

    # Reloaded supplemental movement guards (MovementSignalGuard, GroundSpoofGuard,
    # ElytraSignalGuard and VehicleSignalGuard) report into this same Physics pipeline.
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 is moving incorrectly"
      400: "intave internals sendnotify &c{player}&7/{trust-color}&7 is moving incorrectly #2"
      500: "intave internals storelog {player} {check} {vl}"
      999:
        - $kick$

  # AirStuckGuard is separately configurable because its useful timing window depends
  # on how aggressively a server wants to treat withheld position updates.
  # Violations still feed the Physics/NoFall pipeline.
  airstuckguard:
    enabled: true
    max-gap-ms: 2500
    flag-cooldown-ms: 4000

  timer:
    # Core Timer is mandatory and also owns Reloaded's TickProtocolTimer.
    reverse-blink: true
    high-tolerance: false
    low-tolerance: false
    reverse-lag: false

    # Maximum ticks a player may remain behind the server clock ("blink").
    # -1 disables the hard blink limit.
    blink-limit: -1

    # Classic timer clock tolerance. 1 is the default.
    tolerance: 1

    # Detect/buffer pulse blinking.
    block-pulse-blink: true

    # Reloaded additionally checks client tick-end invariants, vehicle drift and a
    # conservative negative/slow client clock under this same Timer pipeline.
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is speeding up their game"
      75: "intave internals sendnotify &c{player}&7/{trust-color}&7 is speeding up their game #2"
      100:
        - $ban$

  heuristics:
    enabled: true

    # Original Intave heuristic weights remain the public tuning surface.
    # Modern Reloaded heuristics are layered into the same KillAura/Aim VL pipeline.
    classic:
      # Attack heuristics
      attack-accuracy: 4
      attack-required: 3
      pre-attack: 4

      # Rotation heuristics
      rotation-accuracy: 4
      rotation-exact: 10
      rotation-snap: 5
      rotation-sensitivity: -1
      rotation-reset: 3

      # Other combat state heuristics
      inventory-rotations: 2
      blocking: 0
      no-swing: 0
      swing-order: 3
      sprint-toggles: 2
      tool-switch: 3

      thresholds:
        20:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &e{player}&7 is attacking suspiciously #1"
        40:
          - "intave internals sendnotify &e{player}&7 is attacking suspiciously #2"
        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been kicked for attacking suspiciously"
          - $kick$

    # Kept for compatibility with the original config layout. Cloud heuristics are
    # currently not required by Reloaded's local modern combat signals.
    cloud:
      thresholds:
        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for attacking suspiciously (cloud heuristics)"
          - $ban$

  attackraytrace:
    enabled: true

    # AttackRaytrace remains split by reach / hitbox / timeout thresholds.
    applicable-thresholds:
      reach:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking suspiciously (reach)"
        150:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for attacking suspiciously (reach)"
          - $ban$

      hitbox:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking suspiciously (hitbox)"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking suspiciously #2 (hitbox)"

      timeout:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking suspiciously (backtrack?)"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking suspiciously #2 (backtrack?)"

  interactionraytrace:
    enabled: true
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is interacting suspiciously"
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 is interacting suspiciously #2"

  clickpatterns:
    enabled: true
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is clicking statistically anomalously (auto-clicker)"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for clicking statistically anomalously (auto-clicker)"
        - $kick$

  clickspeedlimiter:
    enabled: true
    max-cps: 20
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking too quickly"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for attacking too quickly"
        - $kick$

  breakspeedlimiter:
    enabled: true

    # Reloaded adds packet-protocol, far-envelope, no-swing, air/liquid and use-item
    # guards while keeping the original FastBreak parent threshold.
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 is breaking blocks too quickly"

  protocolscanner:
    enabled: true

    # SentSlotTwice primary/legacy compatible controls.
    sst-vl: 100
    invalid-slot-vl: 100

    # Existing packet-order tuning used by the BadPackets family.
    packet-order-vl: 5

    # Reloaded's ActionOrder, BookEdit, ChatState, DuplicateInput/Movement,
    # Exploit, Sequence, Respawn and invalid-data guards share this parent.
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is sending invalid packets"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for sending invalid packets"
        - $ban$

  placementanalysis:
    enabled: true

    # Hyphenated key is the current name; code still accepts the old check_timings alias.
    check-timings: false

    # Cumulative rotation limit in a five-second window.
    rotation-limit: 3000

    # Reloaded placement packet/cursor/range/rotation guards feed the same Scaffold pipeline.
    cloud-thresholds:
      on-premise:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for placing blocks suspiciously (scaffold)"
          - $ban$

      cloud:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for placing blocks suspiciously (cloud heuristics)"
          - $ban$

  inventoryclickanalysis:
    enabled: true
    high-tolerance: true

    # InventoryStateGuard, AutoTotem and AutoSwap report into this parent pipeline.
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is performing invalid item-operations"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for clicking suspiciously on items"
        - $kick$

cloud:
  enabled: false
  features:
    cloud-storage: true
    cloud-trustfactor: true
    cloud-heuristics: true
    cloud-logs: true

storage:
  auto-logs: false
  recover-vl: true

blacklist:
  apply: true
  message-in-chat: false
  message: "&cYou are on an anti-cheat blacklist and can't join this server"

proxy:
  enable: false

clientwarning:
  enable: true

compatibility:
  position-feedback-sync-enforcement: true
  ignore-scoreboard-packets: false
  no-transaction-obfuscation: false

command:
  hide: true
  reroute:
    "/alerts": "/intave verbose"
    "/cps": "/intave cps"
  fix-tab-kicks: false

rejoin:
  delay: 3600
  refresh: true
  message: "&cYou were removed recently, wait before connecting again"

# Disable fault kicks only to diagnose a confirmed compatibility problem.
fault-kicks:
  position-faults: true
  missing-position-update: true
  feedback-faults: true
  ignoring-feedback: true
  ignoring-keep-alive: true
  invalid-key-input: true
  invalid-player-action: true
  inventory-faults: true

filter:
  equipmentdata: false
  health: true
  vanish: true

logging:
  file-log: true
  trustfactor: true
  client-version: true
  command-execution: true
  fault-kicks: true
  cloud-log-ids: true
  verbose-mode: MITIGATED

analytics:
  errorReporting: true
  usageReporting: true

layout:
  verbose: "{prefix} &c{player}&7/{trust-color}&7 {message} {details} (+{vladded} -> {vl})"
  notify: "{prefix} &c&lNotify&8: &7{text}"
  prefix: "&8[&c&lIntaveReloaded&8]&7 "
