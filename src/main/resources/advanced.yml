# IntaveReloaded advanced configuration
#
# Public check names use familiar Matrix/NCP-style naming, while the internal section names below
# intentionally remain unchanged for backwards compatibility with existing Intave configurations.
#
# Public name -> internal owner
#   Simulate / NoFall / NoSlow / Phase / Sprint / Elytra / Vehicle -> physics
#   KillAura / Aim / NoSwing                                  -> heuristics
#   Reach / HitBox                                            -> attackraytrace
#   Interact                                                  -> interactionraytrace
#   AutoClicker                                               -> clickpatterns
#   ClickSpeed                                                -> clickspeedlimiter
#   Timer / Blink                                             -> timer
#   FastBreak                                                 -> breakspeedlimiter
#   BadPackets / PacketOrder                                  -> protocolscanner
#   Scaffold / FastPlace                                      -> placementanalysis
#   Inventory / InventoryMove / AutoTotem / AutoSwap          -> inventoryclickanalysis
#
# `signals` entries are real startup toggles. Disabling one prevents the corresponding optional
# signal from being linked/flagged. Parent `enabled` keys continue to control the whole check owner.
# Physics and Timer core prediction/clock services remain linked because other checks depend on them.

version: "14.0.0"
state: 0

check:
  physics:
    # Public checks: Simulate, NoFall, NoSlow, Phase, Sprint, Elytra, Vehicle
    # Aliases Speed/Fly/Step/Jesus/Velocity resolve to the Physics owner for API/commands.
    signals:
      nofall: true
      noslow: true
      phase: true
      sprint: true
      elytra: true
      vehicle: true

    # Severely nerfs the physics check.
    # FALSE POSITIVES -> report/fix the underlying case before increasing tolerance.
    high-tolerance: false

    # Mitigation mode: AGGRESSIVE, CAREFUL, LENIENT, BARELY or SILENT.
    mitigation: BARELY

    # Core Simulate/NoSlow state.
    enforce-item-slowdown: true

    # Disable tick leniency for velocity packets.
    no-speculative-velocity: true

    # Disable bundling of Ping packets with their respective attach packets.
    no-bundling: false

    on-detection:
      reset-item-usage: true
      close-inventory: true
      refresh-nearby-blocks: true

    # Shared VL owner for Simulate + layered movement signals.
    # Keep the high kick threshold: NoFall/NoSlow/Phase/Sprint/Elytra/Vehicle evidence is buffered
    # and is designed to corroborate the Physics simulator rather than create a second punishment path.
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &c{check}&7 movement validation"
      400: "intave internals sendnotify &c{player}&7/{trust-color}&7 repeatedly failed &c{check}&7 movement validation"
      500: "intave internals storelog {player} {check} {vl}"
      999:
        - $kick$

  timer:
    # Public checks: Timer, Blink
    # Timer/NegativeTimer/TickTimer/VehicleTimer share this owner. The core PlayerTime clock stays
    # active because packet timing is also used as context by other checks.
    signals:
      blink: true

    # Halt/mitigate outgoing state if the client stops ticking normally.
    reverse-blink: true

    # Maximum ticks behind server time; -1 disables the hard blink limit.
    # 60 ticks = 3 seconds.
    blink-limit: -1

    # Detect/block pulse blinking.
    block-pulse-blink: true

    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &c{check}&7 timing validation"
      75: "intave internals sendnotify &c{player}&7/{trust-color}&7 repeatedly failed &c{check}&7 timing validation"
      100:
        - "intave internals storelog {player} {check} {vl}"
        - $ban$

  heuristics:
    enabled: true

    # Public combat groups. These switches affect both classic and modern layered logic.
    signals:
      killaura: true
      aim: true

    # Violation increases for classic heuristic components.
    # -1 disables the individual classic component.
    #  0 keeps mitigation/evidence active without adding VL.
    classic:
      # Aim
      attack-accuracy: 4
      rotation-accuracy: 4
      rotation-exact: 10
      rotation-snap: 5
      rotation-sensitivity: -1
      rotation-reset: 3

      # KillAura / NoSwing / combat action state
      attack-required: 3
      pre-attack: 4
      inventory-rotations: 2
      blocking: 0
      no-swing: 0
      swing-order: 3
      sprint-toggles: 2
      tool-switch: 3

      # Shared threshold path for classic + modern Aim/KillAura evidence.
      thresholds:
        20:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &e{player}&7 failed &e{check}&7 combat validation #1"
        40:
          - "intave internals sendnotify &e{player}&7 failed &e{check}&7 combat validation #2"
        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for &c{check}&7 combat violations"
          - $kick$

    cloud:
      thresholds:
        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for suspicious combat (cloud heuristics)"
          - $ban$

  attackraytrace:
    # Public checks: Reach, HitBox
    enabled: true

    # Reach and HitBox intentionally keep separate thresholds even though they share the same
    # latency-compensated AttackRaytrace engine.
    applicable-thresholds:
      reach:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cReach&7 validation"
        150:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for repeated &cReach&7 violations"
          - $ban$

      hitbox:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cHitBox&7 validation"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 repeatedly failed &cHitBox&7 validation"

      # Backtrack/latency-abuse evidence remains owned by AttackRaytrace.
      timeout:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 is attacking with suspicious entity latency"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 repeatedly failed entity-latency validation"

  interactionraytrace:
    # Public check: Interact
    enabled: true
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cInteract&7 validation"
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 repeatedly failed &cInteract&7 validation"

  clickpatterns:
    # Public check: AutoClicker
    enabled: true
    # Modern clients use confirmed ATTACK-interval consistency in addition to legacy pattern logic.
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cAutoClicker&7 pattern validation"
      100:
        - "intave internals storelog {player} {check} {vl}"
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for automated clicking"
        - $kick$

  clickspeedlimiter:
    # Public check: ClickSpeed
    enabled: true
    max-cps: 20
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cClickSpeed&7 validation"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for attacking too quickly"
        - $kick$

  breakspeedlimiter:
    # Public check: FastBreak
    # Includes duration/restart, NoSwingBreak, FarBreak, Wrong/Multi/Invalid/PositionBreak,
    # AirLiquidBreak and break-while-using layered evidence.
    enabled: true
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &cFastBreak&7 validation"

  protocolscanner:
    # Public checks: BadPackets, PacketOrder
    enabled: true
    invokant: false
    check_sent_slot_twice_vl: 100
    packet-order-vl: 5

    # Optional BadPackets sub-groups. The core protocol sanity checks remain controlled by `enabled`.
    signals:
      packetorder: true
      duplicate-movement: true
      chat: true
      book-edit: true

    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &c{check}&7 protocol validation"
      100:
        - "intave internals storelog {player} {check} {vl}"
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for invalid protocol behaviour (&c{check}&7)"
        - $ban$

  placementanalysis:
    # Public checks: Scaffold, FastPlace
    # Includes timing/rotation plus FarPlace, raw face, air/liquid support history, hidden-face,
    # MultiPlace, dynamic fabricated cursor and duplicate-rotation placement evidence.
    enabled: true
    check_timings: false

    # Cumulative rotation in a 5-second window. 360 degrees = one full rotation.
    rotation-limit: 3000

    cloud-thresholds:
      on-premise:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for &cScaffold&7 violations"
          - $ban$

      cloud:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for suspicious placement (cloud heuristics)"
          - $ban$

  inventoryclickanalysis:
    # Public checks: Inventory, InventoryMove, AutoTotem, AutoSwap
    enabled: true
    high-tolerance: true

    signals:
      inventorymove: true
      autototem: true
      autoswap: true

    # Shared VL owner. Action-while-open checks may cancel an impossible action immediately while
    # buffered automation/movement evidence continues through these thresholds.
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 failed &c{check}&7 inventory validation"
      100:
        - "intave internals storelog {player} {check} {vl}"
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 has been removed for suspicious inventory behaviour (&c{check}&7)"
        - $kick$

cloud:
  enabled: false

  features:
    cloud-storage: true
    cloud-trustfactor: true
    cloud-heuristics: true
    cloud-logs: true

storage:
  auto-logs: false
  recover-vl: true

blacklist:
  apply: true
  message-in-chat: false
  message: "&cYou are on an anti-cheat blacklist and can't join this server"

proxy:
  enable: false

clientwarning:
  enable: true

compatibility:
  # Position-feedback synchronization enforcement. Disable only for GuardSpigot compatibility.
  position-feedback-sync-enforcement: true
  ignore-scoreboard-packets: false
  no-transaction-obfuscation: false

command:
  hide: true
  reroute:
    "/alerts": "/intave verbose"
    "/cps": "/intave cps"
  fix-tab-kicks: false

rejoin:
  # DO NOT DISABLE IN PRODUCTION.
  delay: 3600
  refresh: true
  message: "&cYou were removed recently, wait before connecting again"

# Disable fault kicks only after confirming a compatibility issue.
fault-kicks:
  position-faults: true
  missing-position-update: true
  feedback-faults: true
  ignoring-feedback: true
  ignoring-keep-alive: true
  invalid-key-input: true
  invalid-player-action: true
  inventory-faults: true

filter:
  equipmentdata: false
  health: true
  vanish: true

logging:
  file-log: true
  trustfactor: true
  client-version: true
  command-execution: true
  fault-kicks: true
  cloud-log-ids: true
  verbose-mode: MITIGATED

analytics:
  errorReporting: true
  usageReporting: true

layout:
  verbose: "{prefix} &c{player}&7/{trust-color}&7 &c{check}&7: {message} {details} (+{vladded} -> {vl})"
  notify: "{prefix} &c&lNotify&8: &7{text}"
  prefix: "&8[&c&lIntave&8]&7 "
