# Selected config
#   THIS     - use this simple config; advanced.yml is used as the default base internally
#   ADVANCED - use advanced.yml directly for per-check thresholds and signal toggles
#   ONLINE/[config-name] (planned) - use the cloud config
#
# The detailed Matrix/NCP-style check controls (Aim, KillAura, NoFall, NoSlow, Elytra,
# AutoTotem, PacketOrder, etc.) live in advanced.yml under check.<owner>.signals.
config: THIS

prefix: "&8[&c&lIntave&8]&7 "

kick-commands:
  - "intave internals kickip {player} &cYou have been kicked, as an account with your ip address was removed from the game"
  - "kick {player} &cYou have been removed from the game based on data that was collected by the anti-cheat ({log-id})"

ban-commands:
  - "intave internals kickip {player} &cYou have been kicked, as an account with your ip address was removed from the game"
  - "ban {player} Cheating / {log-id}"

# Movement setback sensitivity
#   Choose between AGGRESSIVE, CAREFUL, LENIENT, BARELY and SILENT
physics-mm: BARELY

# Rejoin delay after issued kick (in seconds)
rejoin-delay: 3600

# Cloud privacy control
#   HIGHEST_PRIVACY - only the most critical data is sent (player UUID and usage data)
#   BEST_DETECTION  - also share IP address for long-term cross-account analysis & detection
#
# BEST_DETECTION requires you to update your server's privacy policy or let players know
# the first time they join, as it is considered personal data under GDPR.
privacy: HIGHEST_PRIVACY

# {check} now uses public names such as Reach, HitBox, KillAura, Aim, NoFall, Simulate,
# AutoTotem, Scaffold, BadPackets, PacketOrder, ...
verbose: "{prefix} &c{player}&7/{trust-color}&7 &c{check}&7: {message} {details} (+{vladded} -> {vl})"
notify: "{prefix} &c&lInfo&8: &7{text}"
